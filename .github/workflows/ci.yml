name: base-go CI/CD

on:
    workflow_dispatch:
    push:

concurrency:
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

#
# Before deployment, you must:
#
# 1. Deploy your Railway service as pointing to the image.
# 2. Add the RAILWAY_TOKEN secret to your repository.
# 3. Make sure environment variables are set correctly at the Railway side.
#
# Note that if you're not forking and just using the image, you can just rely on automatic updates.
# You don't need to fork the repository or mess around with any of this.
#

env:
    RAILWAY_SERVICE: base-go

jobs:
    test-go:
        runs-on: ubuntu-26.04
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: base-go
                    POSTGRES_PASSWORD: base-go
                    POSTGRES_DB: base-go
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            CLIENTS_DB_TEST_DSN: postgres://base-go:base-go@localhost:5432/base-go?sslmode=disable
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: moonrepo/setup-toolchain@v0
              with:
                  auto-install: true
                  auto-setup: true
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('go/go.sum', 'go/tools/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-
            - run: moon run go:install
            - run: moon run go:install-tools
            - name: add Go tools to PATH
              run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            - run: moon run go:build
            - run: moon run go:lint-check
            - run: moon run go:format-check
            - run: moon run go:audit
            - run: moon run go:test
              env:
                  CGO_ENABLED: "1"
            - name: run Go coverage
              working-directory: go
              run: go tool cover -func=coverage.out

